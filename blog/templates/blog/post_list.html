<!DOCTYPE html>
<html lang="en">
<head>

    <main class="main-container">
        <header class="blog-header">
            <h1>My IT Career Journey</h1>
            <p class="blog-subtitle">Bridging Infrastructure Engineering and Software Automation</p>
        </header>
    
        <div class="posts-list">
            {% for post in posts %}
                <article>
                    <time>published: {{ post.published_date }}</time>
                    <h2><a href="">{{ post.title }}</a></h2>
                     <p>{{ post.text|linebreaksbr }}</p>
                </article>
            {% endfor %}
        </div>
    </main>

    <footer class="footer">

    </footer>

</body>
